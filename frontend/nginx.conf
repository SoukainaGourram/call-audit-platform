server {
    listen 80;
    server_name localhost;

    location /api/auth/ {
        proxy_pass http://auth-service:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Sécurisation : Blocage strict de l'endpoint interne de récupération des comptes BCrypt
    location /api/users/internal/ {
        return 403;
    }

    # Gestion du POST /api/users (sans slash final) pour la création d'utilisateurs
    location = /api/users {
        proxy_pass http://user-service:8082/api/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/users/ {
        proxy_pass http://user-service:8082/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/calls/ {
        proxy_pass http://call-history-service:8083/api/calls/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/searches/ {
        proxy_pass http://search-history-service:8084/api/searches/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
