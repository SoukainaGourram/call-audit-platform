<div class="app-layout" [class.no-auth]="!authService.isLoggedIn()">
  <!-- Top Corporate Navbar Matching Glassmorphism Design -->
  <header *ngIf="authService.isLoggedIn()" class="inwi-header page-container">
    
    <!-- Brand Logo Box with official inwi SVG logo (NO Enterprise) -->
    <div style="display: flex; align-items: center; gap: 14px;">
      <img src="inwi-official-logo.svg" alt="inwi" style="height: 38px; width: auto; filter: drop-shadow(0 0 12px var(--inwi-magenta-glow));" />

      <!-- SQL Online Pill -->
      <div class="status-pill-green">
        <span class="status-dot-green"></span>
        <span>SQL En Ligne</span>
      </div>
    </div>

    <!-- Center Navigation Filter Chips -->
    <nav class="inwi-nav-chips">
      <a routerLink="/search" routerLinkActive="active" class="inwi-nav-chip">
        <i class="fa-solid fa-phone-volume"></i>
        <span>Appels & Masquage</span>
      </a>
      <a routerLink="/history" routerLinkActive="active" class="inwi-nav-chip">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Traçabilité Audit</span>
      </a>
      <a *ngIf="authService.isAdmin()" routerLink="/users" routerLinkActive="active" class="inwi-nav-chip">
        <i class="fa-solid fa-users-gear"></i>
        <span>Utilisateurs</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="inwi-nav-chip">
        <i class="fa-solid fa-id-card"></i>
        <span>Mon Profil</span>
      </a>
    </nav>

    <!-- User Profile & Morocco Flag Pill -->
    <div *ngIf="authService.currentUser() as user" style="display: flex; align-items: center; gap: 12px;">
      <div class="user-pill-badge">
        <div class="user-avatar-circle">
          {{ (user.fullName || user.username).charAt(0).toUpperCase() }}
        </div>
        <span style="font-size: 0.85rem; font-weight: 700; color: #ffffff;">
          {{ user.fullName || user.username }}
        </span>
        <span style="font-size: 1rem;" title="Maroc">🇲🇦</span>
        <i class="fa-regular fa-bell" style="color: var(--text-sub); font-size: 0.9rem; cursor: pointer;"></i>
      </div>

      <button (click)="onLogout()" class="inwi-btn-danger" style="padding: 8px 14px; font-size: 0.8rem; border-radius: 18px;" title="Déconnexion">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Déconnexion</span>
      </button>
    </div>

  </header>

  <!-- Main View Container -->
  <main class="page-container" style="padding-bottom: 40px;">
    <router-outlet></router-outlet>
  </main>
</div>
