<div class="page-container">
  <div class="inwi-outer-frame">

    <!-- Page Header -->
    <div style="margin-bottom: 28px;">
      <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; display: flex; align-items: center; gap: 12px;">
        <i class="fa-solid fa-id-card" style="color: var(--inwi-magenta-bright);"></i>
        Mon Profil Utilisateur & Sécurité
      </h1>
      <p style="color: var(--text-sub); font-size: 0.9rem;">
        Gestion de vos informations d'identité et mise à jour sécurisée des accès système
      </p>
    </div>

    <!-- 2 Column Grid for Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px;">
      
      <!-- Profile Info Glass Card -->
      <div class="inwi-glass-card">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-user-gear" style="color: var(--inwi-purple);"></i>
            Informations du Profil
          </h3>
          <span class="badge-capsule-reussi" [style.background]="role === 'ADMIN' ? 'var(--inwi-magenta)' : 'rgba(255,255,255,0.1)'">
            <i [class]="role === 'ADMIN' ? 'fa-solid fa-crown' : 'fa-solid fa-user-shield'" style="margin-right: 6px;"></i>
            {{ role === 'ADMIN' ? 'ADMINISTRATEUR' : 'AGENT' }}
          </span>
        </div>

        <div *ngIf="profileMsg" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; font-size: 0.85rem;">
          <i class="fa-solid fa-circle-check" style="margin-right: 8px;"></i>
          <span>{{ profileMsg }}</span>
        </div>

        <div *ngIf="profileError" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; font-size: 0.85rem;">
          <i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i>
          <span>{{ profileError }}</span>
        </div>

        <form (ngSubmit)="onUpdateProfile()">
          <div class="inwi-form-group">
            <label class="inwi-label">
              <i class="fa-solid fa-user-lock" style="color: var(--text-sub);"></i>
              Identifiant d'accès (Login)
            </label>
            <input type="text" [value]="username" disabled class="inwi-input" />
          </div>

          <div class="inwi-form-group">
            <label class="inwi-label">
              <i class="fa-solid fa-id-card-clip" style="color: var(--inwi-magenta-bright);"></i>
              Nom et Prénom
            </label>
            <input type="text" class="inwi-input" [(ngModel)]="fullName" name="fullName" placeholder="ex: Soukaina Gourram" required />
          </div>

          <div class="inwi-form-group" style="margin-bottom: 24px;">
            <label class="inwi-label">
              <i class="fa-solid fa-envelope" style="color: #38bdf8;"></i>
              Adresse Email Professionnelle
            </label>
            <input type="email" class="inwi-input" [(ngModel)]="email" name="email" placeholder="ex: contact@inwi.ma" required />
          </div>

          <button type="submit" class="inwi-btn-primary" style="width: 100%; height: 48px;">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Enregistrer les modifications</span>
          </button>
        </form>
      </div>

      <!-- Password Security Glass Card -->
      <div class="inwi-glass-card">
        <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-key" style="color: #f59e0b;"></i>
            Sécurité & Mot de Passe
          </h3>
        </div>

        <div *ngIf="passwordMsg" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; font-size: 0.85rem;">
          <i class="fa-solid fa-circle-check" style="margin-right: 8px;"></i>
          <span>{{ passwordMsg }}</span>
        </div>

        <div *ngIf="passwordError" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; font-size: 0.85rem;">
          <i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i>
          <span>{{ passwordError }}</span>
        </div>

        <form (ngSubmit)="onChangePassword()">
          <div class="inwi-form-group">
            <label class="inwi-label">
              <i class="fa-solid fa-lock" style="color: #f59e0b;"></i>
              Ancien mot de passe
            </label>
            <input type="password" class="inwi-input" [(ngModel)]="oldPassword" name="oldPassword" placeholder="••••••••••••" required />
          </div>

          <div class="inwi-form-group">
            <label class="inwi-label">
              <i class="fa-solid fa-shield-halved" style="color: #10b981;"></i>
              Nouveau mot de passe
            </label>
            <input type="password" class="inwi-input" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••••••" required />
          </div>

          <div class="inwi-form-group" style="margin-bottom: 24px;">
            <label class="inwi-label">
              <i class="fa-solid fa-shield-check" style="color: #34d399;"></i>
              Confirmer le nouveau mot de passe
            </label>
            <input type="password" class="inwi-input" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••••••" required />
          </div>

          <button type="submit" class="inwi-btn-secondary" style="width: 100%; height: 48px;">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Mettre à jour le mot de passe</span>
          </button>
        </form>
      </div>

    </div>

  </div>
</div>
