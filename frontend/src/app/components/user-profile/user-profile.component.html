<div class="page-container">
  <div class="header-section">
    <div>
      <h1>Mon Profil Utilisateur</h1>
      <p class="subtitle">Gérez vos informations personnelles et votre sécurité</p>
    </div>
  </div>

  <div class="profile-grid">
    <!-- Card Informations Personnelles -->
    <div class="profile-card glass-panel">
      <div class="card-header">
        <h3>👤 Informations Personnelles</h3>
        <span class="role-badge" [ngClass]="role === 'ADMIN' ? 'role-admin' : 'role-user'">
          {{ role === 'ADMIN' ? '👑 Administrateur' : '👤 Agent Utilisateur' }}
        </span>
      </div>

      <div *ngIf="profileMsg" class="alert alert-success">
        ✅ {{ profileMsg }}
      </div>
      <div *ngIf="profileError" class="alert alert-error">
        ⚠️ {{ profileError }}
      </div>

      <form (ngSubmit)="onUpdateProfile()" class="profile-form">
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input type="text" [value]="username" disabled class="disabled-input" />
        </div>

        <div class="form-group">
          <label>Nom Complet</label>
          <input type="text" [(ngModel)]="fullName" name="fullName" required />
        </div>

        <div class="form-group">
          <label>Adresse Email</label>
          <input type="email" [(ngModel)]="email" name="email" required />
        </div>

        <button type="submit" class="btn btn-primary">
          Enregistrer les modifications
        </button>
      </form>
    </div>

    <!-- Card Modification Mot de passe -->
    <div class="profile-card glass-panel">
      <div class="card-header">
        <h3>🔐 Changer mon Mot de passe</h3>
      </div>

      <div *ngIf="passwordMsg" class="alert alert-success">
        ✅ {{ passwordMsg }}
      </div>
      <div *ngIf="passwordError" class="alert alert-error">
        ⚠️ {{ passwordError }}
      </div>

      <form (ngSubmit)="onChangePassword()" class="profile-form">
        <div class="form-group">
          <label>Ancien mot de passe</label>
          <input type="password" [(ngModel)]="oldPassword" name="oldPassword" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label>Confirmer le nouveau mot de passe</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-secondary">
          Mettre à jour le mot de passe
        </button>
      </form>
    </div>
  </div>
</div>
