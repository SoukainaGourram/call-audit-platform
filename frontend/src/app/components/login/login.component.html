<div class="login-container">
  <div class="login-card glass-panel">
    <div class="brand-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <h2>Inwi Call History</h2>
      <p class="subtitle">Plateforme Sécurisée de Consultation des Appels</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div *ngIf="errorMsg" class="alert alert-error">
        <span>{{ errorMsg }}</span>
      </div>

      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="username" 
          name="username" 
          placeholder="ex: admin ou user" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Connexion</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="demo-buttons">
        <p>Connexion rapide de démo :</p>
        <div class="btn-group">
          <button type="button" class="btn btn-secondary btn-sm" (click)="quickLogin('admin')">
            👑 Admin (admin/admin123)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" (click)="quickLogin('user')">
            👤 Agent (user/user123)
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
