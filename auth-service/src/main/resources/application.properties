server.port=8081
spring.application.name=auth-service

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}

# HikariCP Connection Pool Configuration (Tuning Performance)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Boot Actuator Security Configuration (Seul health est exposé publiquement)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration (Secret Key & Expiration 24h = 86400000ms)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# User-Service REST URL & Timeouts (ms)
user-service.url=${USER_SERVICE_URL:http://user-service:8082}
user-service.connect-timeout=1000
user-service.read-timeout=1000